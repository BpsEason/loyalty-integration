name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      LARAVEL_API_BASE_URL: ${{ secrets.LARAVEL_API_BASE_URL }}
      LARAVEL_EMAIL: ${{ secrets.LARAVEL_EMAIL }}
      LARAVEL_PASSWORD: ${{ secrets.LARAVEL_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate API routes
        run: python verify_routes.py

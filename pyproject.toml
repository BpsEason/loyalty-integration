[project]
name = "loyalty-integration"
version = "1.0.0"
description = "外部整合層，串接 Laravel Multi-Tenant Loyalty Platform"
authors = []
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx2>=2.0.0",
    "websockets==15.0.1",
    "pusher==3.3.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "rich==15.0.0",
    "python-json-logger==3.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a live Laravel API",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # comprehensions
    "SIM", # simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "S",  # flake8-bandit (security checks)
    "G",  # flake8-logging
    "PERF", # perf
    "TCH", # test-checking
]
ignore = []
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".git",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "src"]
lines-after-imports = 2
order-by-type = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "normal"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
exclude = [
    "^\\.venv",
    "^__pycache__",
    "^\\.pytest_cache",
    "^\\.mypy_cache",
    "^\\.git",
    "^dist",
    "^build",
]
plugins = ["pydantic.mypy"]
pythonpath = ["."]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true